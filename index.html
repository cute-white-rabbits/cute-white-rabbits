<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛白兔專賣店</title>
    <style>
        body { 
            font-family: '微軟正黑體', sans-serif; 
            background-color: #fce4ec; 
            color: #333; 
            text-align: center; 
        }
        h1 { color: #d81b60; margin-top: 30px; }
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 260px; 
            padding: 20px; 
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { 
            width: 100%; 
            border-radius: 10px; 
            height: 180px;
            object-fit: cover;
        }
        .price { 
            color: #e91e63; 
            font-size: 1.3em; 
            font-weight: bold; 
            margin: 15px 0;
        }
        .btn { 
            background-color: #f06292; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 1em;
        }
        .btn:hover { background-color: #d81b60; }
    </style>
</head>
<body>

    <h1>🐰 歡迎光臨可愛白兔專賣店 🐰</h1>
    <p>精選各品種純白小兔，讓毛茸茸的溫柔融化您的心！</p>

    <div class="container">
        <div class="card">
            <h2>紐西蘭白兔</h2>
            <p>體型圓潤，性格溫順親人，是最完美的家庭伴侶。</p>
            <p class="price">報價：NT$ 1,500</p>
            <button class="btn">聯絡購買</button>
        </div>

        <div class="card">
            <h2>安哥拉白兔</h2>
            <p>擁有如雲朵般蓬鬆柔軟的長毛，氣質高貴優雅。</p>
            <p class="price">報價：NT$ 3,200</p>
            <button class="btn">聯絡購買</button>
        </div>

        <div class="card">
            <h2>白獅子兔</h2>
            <p>頸部有著可愛迷人的「獅鬃」，小巧精緻活潑。</p>
            <p class="price">報價：NT$ 2,500</p>
            <button class="btn">聯絡購買</button>
        </div>

        <div class="card">
            <h2>荷蘭侏儒白兔</h2>
            <p>體型極度嬌小，耳朵短小，永遠像個長不大的孩子。</p>
            <p class="price">報價：NT$ 4,000</p>
            <button class="btn">聯絡購買</button>
        </div>
    </div>

</body>
</html>
