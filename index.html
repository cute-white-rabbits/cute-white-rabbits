<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛白兔專賣店</title>
    <style>
        body { 
            font-family: '微軟正黑體', sans-serif; 
            background-color: #fce4ec; 
            color: #333; 
            text-align: center; 
            margin: 0;
            padding: 0;
        }
        h1 { color: #d81b60; margin-top: 30px; }
        .intro { color: #666; font-size: 1.1em; margin-bottom: 30px; }
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 25px; 
            padding: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
            width: 280px; 
            padding: 15px; 
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .image-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f5f5f5;
        }
        .card img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
        }
        .card h2 {
            font-size: 1.4em;
            color: #c2185b;
            margin: 15px 0 10px 0;
        }
        .card p {
            font-size: 0.95em;
            color: #555;
            line-height: 1.5;
            margin: 0 0 15px 0;
            flex-grow: 1;
        }
        .price { 
            color: #e91e63; 
            font-size: 1.4em; 
            font-weight: bold; 
            margin-bottom: 15px;
        }
        .btn { 
            background-color: #f06292; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.2s;
            text-decoration: none; 
            display: block; 
            text-align: center;
        }
        .btn:hover { background-color: #d81b60; }
    </style>
</head>
<body>

    <h1>🐰 歡迎光臨可愛白兔專賣店 🐰</h1>
    <p class="intro">精選各品種純白小兔，讓毛茸茸的溫柔融化您的心！</p>

    <div class="container">
        <!-- 紐西蘭白兔 -->
        <div class="card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1601662528567-2f168f03f388?q=80&w=500" alt="紐西蘭白兔">
            </div>
            <h2>紐西蘭白兔</h2>
            <p>體型圓潤，性格溫順親人，紅寶石般的眼睛非常迷人，是最完美的家庭伴侶。</p>
            <div class="price">報價：CAD$ 60</div>
            <a href="mailto:intelligence@shadowproxy.space?subject=我想購買：紐西蘭白兔" class="btn">聯絡購買</a>
        </div>

        <!-- 安哥拉白兔 -->
        <div class="card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1563223552-30d01dfe3130?q=80&w=500" alt="安哥拉白兔">
            </div>
            <h2>安哥拉白兔</h2>
            <p>擁有如雲朵般蓬鬆柔軟的極致長毛，像一團會移動的棉花糖，氣質高貴優雅。</p>
            <div class="price">報價：CAD$ 130</div>
            <a href="mailto:intelligence@shadowproxy.space?subject=我想購買：安哥拉白兔" class="btn">聯絡購買</a>
        </div>

        <!-- 白獅子兔 -->
        <div class="card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1591871937631-2f64059d234f?q=80&w=500" alt="白獅子兔">
            </div>
            <h2>白獅子兔</h2>
            <p>頸部有著圍巾般迷人的「獅子鬃毛」，小巧精緻且充滿好奇心，活潑又討喜。</p>
            <div class="price">報價：CAD$ 100</div>
            <a href="mailto:intelligence@shadowproxy.space?subject=我想購買：白獅子兔" class="btn">聯絡購買</a>
        </div>

        <!-- 荷蘭侏儒白兔 -->
        <div class="card">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1533467688531-308801513733?q=80&w=500" alt="荷蘭侏儒白兔">
            </div>
            <h2>荷蘭侏儒白兔</h2>
            <p>體型極度嬌小，耳朵短小呆萌，成年後依然保持嬰兒般的無辜感，非常受歡迎。</p>
            <div class="price">報價：CAD$ 160</div>
            <a href="mailto:intelligence@shadowproxy.space?subject=我想購買：荷蘭侏儒白兔" class="btn">聯絡購買</a>
        </div>
    </div>

</body>
</html>
